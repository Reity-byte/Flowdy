name: Release All Platforms

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # 1. JOB: Desktop (Windows, MacOS, Linux)
  build-desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install NPM dependencies
        run: npm ci

      - name: Build Desktop Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # Verze se vezme z package.json
          releaseName: "Flowdy v__VERSION__"
          releaseBody: "Automatický build pro desktop a Android."
          releaseDraft: true
          prerelease: false

  # 2. JOB: Android
  build-android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust (with Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: false

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install NPM dependencies
        run: npm ci

      - name: Read app version
        id: version
        # Same source tauri-action reads for the desktop job's v__VERSION__
        # tag (package.json), so both jobs land assets on the SAME release
        # instead of two disconnected drafts.
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Regenerate icons
        # Refreshes src-tauri/icons/{android,ios,...} from the source icon.
        # Must run BEFORE `tauri android init` so the freshly-scaffolded
        # Android project picks up current icons instead of whatever was
        # already committed in src-tauri/icons/android.
        run: npx tauri icon icon.png

      - name: Tauri Android Init
        # Only needed if the generated project isn't already checked in.
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npx tauri android init
          fi

      - name: Build Android APK
        run: npx tauri android build --debug
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          draft: true