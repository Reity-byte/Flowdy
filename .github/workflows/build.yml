name: Release All Platforms

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # 1. JOB: Desktop (Windows, MacOS, Linux)
  build-desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    # For a matrix job, GitHub Actions takes a job output's value from
    # whichever matrix leg finishes last — fine here, since both legs
    # create-or-reuse the SAME tagged release, so releaseId is identical
    # either way. build-android reads this to upload directly by release ID
    # instead of looking the release up by tag again (see that job's own
    # comment for why that specific operation is the one that kept failing).
    outputs:
      release_id: ${{ steps.tauri_build.outputs.releaseId }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install NPM dependencies
        run: npm ci

      - name: Build Desktop Application
        id: tauri_build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # Verze se vezme z package.json
          releaseName: "Flowdy v__VERSION__"
          releaseBody: "Automatický build pro desktop a Android."
          releaseDraft: true
          prerelease: false

  # 2. JOB: Android
  build-android:
    # Waits for build-desktop so its release-upload step never races
    # tauri-action's own create/update of the same v__VERSION__ release —
    # that race is what caused "Resource not accessible by integration" on
    # softprops/action-gh-release's update call in an earlier run.
    needs: build-desktop
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust (with Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: false

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install NPM dependencies
        run: npm ci

      - name: Regenerate icons
        # Refreshes src-tauri/icons/{android,ios,...} from the source icon.
        # Must run BEFORE `tauri android init` so the freshly-scaffolded
        # Android project picks up current icons instead of whatever was
        # already committed in src-tauri/icons/android.
        run: npx tauri icon icon.png

      - name: Tauri Android Init
        # Only needed if the generated project isn't already checked in.
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npx tauri android init
          fi

      - name: Build Android APK
        run: npx tauri android build --debug
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Upload APK as workflow artifact
        # Doesn't touch the Releases API at all, so it can't fail for the
        # same reason the release-upload step below can — a guaranteed way
        # to grab the APK from this run's "Artifacts" section regardless of
        # what happens to the release attach. Kept 90 days (GitHub default).
        uses: actions/upload-artifact@v4
        with:
          name: flowdy-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload APK to Release
        # Every previous approach here (softprops/action-gh-release, both
        # via env: GITHUB_TOKEN and the documented with: token: input) hit
        # "Resource not accessible by integration" specifically on the
        # get-release-by-tag + update-release calls needed to attach an
        # asset to a release a DIFFERENT job/tool already created — reliably
        # reproduced across three separate runs, ruling out both a race
        # (build-android already runs strictly after build-desktop) and the
        # repo's Workflow permissions setting (confirmed already "Read and
        # write"). Sidestepping the mystery entirely: upload straight to the
        # release's numeric ID (from build-desktop's tauri-action output),
        # which needs no tag lookup and no "edit this release" call at all —
        # just the same "upload a release asset" endpoint tauri-action
        # itself already uses successfully for the desktop bundles.
        #
        # This release is a persistent draft reused across runs (same
        # v__VERSION__ tag every time, per package.json), so a prior run's
        # apk asset is often still attached under the same name — the
        # upload-asset endpoint returns 422 ("already_exists") rather than
        # overwriting it, which is what actually failed here. Delete any
        # existing asset with the same name on this release first (look it
        # up in the release's own asset list, not by guessing an ID), then
        # upload fresh.
        if: startsWith(github.ref, 'refs/heads/main')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.build-desktop.outputs.release_id }}
        run: |
          set -e
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::build-desktop did not report a release_id — nothing to upload to."
            exit 1
          fi
          find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | while read -r f; do
            name=$(basename "$f")

            existing_id=$(curl -sSL -f \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets" \
              | jq -r --arg name "$name" '.[] | select(.name == $name) | .id' | head -n1)

            if [ -n "$existing_id" ]; then
              echo "Deleting existing asset $name (id $existing_id) before re-upload"
              curl -sSL -f -X DELETE \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/releases/assets/$existing_id"
            fi

            echo "Uploading $name to release $RELEASE_ID"
            curl -sSL -f -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary @"$f" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=$name"
          done